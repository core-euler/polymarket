[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "polymarket-assistant"
version = "0.1.0"
description = "Telegram assistant for Polymarket analytics and paper trading"
readme = "ROADMAP.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116.0",
  "uvicorn[standard]>=0.35.0",
  "aiogram>=3.18.0",
  "sqlalchemy[asyncio]>=2.0.39",
  "asyncpg>=0.30.0",
  "alembic>=1.15.0",
  "pydantic>=2.11.0",
  "pydantic-settings>=2.8.0",
  "celery[redis]>=5.5.0",
  "redis>=5.2.1",
  "httpx>=0.28.1",
  "python-dotenv>=1.0.1",
  "tenacity>=9.0.0",
  "structlog>=25.2.0",
  "feedparser>=6.0.11",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.5",
  "pytest-asyncio>=0.25.3",
  "ruff>=0.11.0",
  "aiosqlite>=0.21.0",
]

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
